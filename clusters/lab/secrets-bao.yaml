apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-bao
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./secrets-bao
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-openbao     # the token from step 2
